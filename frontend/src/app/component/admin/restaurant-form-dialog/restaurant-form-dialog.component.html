<div class="bg-white">
    <!-- Error Message -->
    <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
        {{ errorMessage }}
    </div>

    <div class="px-4 py-3 border-b border-gray-200">
        <h2 class="text-lg font-medium text-gray-900">
            {{isEditMode ? 'Edit' : 'Add'}} Restaurant
        </h2>
    </div>

    <!-- Form content -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4 px-4 py-3">
        <!-- Restaurant Name -->
        <div>
            <label for="name" class="block font-medium text-gray-700 mb-1">Restaurant Name</label>
            <input type="text" id="name" formControlName="name"
                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <div *ngIf="form.get('name')?.touched && form.get('name')?.errors" class="text-red-500 mt-1">
                <div *ngIf="form.get('name')?.errors?.['required']">Restaurant name is required</div>
                <div *ngIf="form.get('name')?.errors?.['minlength']">Name must be at least 3 characters</div>
            </div>
        </div>

        <!-- Address -->
        <div>
            <label for="address" class="block font-medium text-gray-700 mb-1">Address</label>
            <textarea id="address" formControlName="address" rows="3"
                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
            <div *ngIf="form.get('address')?.touched && form.get('address')?.errors" class="text-red-500 mt-1">
                <div *ngIf="form.get('address')?.errors?.['required']">Address is required</div>
            </div>
        </div>

        <!-- Image Upload -->
        <div>
            <label for="image" class="block font-medium text-gray-700 mb-1">Restaurant Image</label>
            <input type="file" id="image" accept="image/*" (change)="onFileSelected($event)"
                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">

            <!-- Image Preview -->
            <div *ngIf="imagePreview" class="mt-2">
                <img [src]="imagePreview" alt="Preview" class="max-w-xs h-auto rounded border border-gray-300">
            </div>
        </div>

        <!-- Actions -->
        <div class="flex justify-end gap-2 pt-4">
            <button type="button" (click)="close.emit()"
                class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">
                Cancel
            </button>
            <button type="submit" [disabled]="isLoading || !form.valid"
                class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 disabled:bg-gray-400 disabled:cursor-not-allowed">
                {{ isLoading ? 'Saving...' : isEditMode ? 'Update' : 'Create' }}
            </button>
        </div>
    </form>
</div>
